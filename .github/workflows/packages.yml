name: Native packages

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      filename: ${{ steps.sdist.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Check C++ formatting
        shell: bash
        run: |
          python -m pip install clang-format==22.1.8
          git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror
      - id: sdist
        name: Build source distribution
        shell: bash
        run: |
          python -m pip install build
          python -m build --sdist
          for archive in dist/*.tar.gz; do
            echo "filename=$(basename "$archive")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel:
    name: Wheel and installed tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: sdist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15]
    env:
      CIBW_CONFIG_SETTINGS: cmake.define.SYNTWINE_NATIVE_TESTS=ON
      CIBW_ENVIRONMENT: CMAKE_BUILD_PARALLEL_LEVEL=6
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: sdist
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: sdist/${{ needs.sdist.outputs.filename }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
